; PlatformIO Project Configuration File
; Phase 1 AI - Obstacle Avoidance Robot
;
; Converted from Basic Stamp 2 to ATtiny2313
; Original by Matthew Whited - v0.1 - 12/29/2001

[platformio]
default_envs = attiny2313

[env:attiny2313]
platform = atmelavr
board = attiny2313
framework = arduino

; Clock frequency (1MHz internal RC default)
board_build.f_cpu = 1000000L

; Upload settings - adjust for your programmer
upload_protocol = usbtiny
; upload_protocol = usbasp
; upload_protocol = stk500v1
; upload_port = COM3
; upload_speed = 19200

; Build flags
build_flags =
    -D IRPD_PULSE_MS=5
    -D LOOP_DELAY_MS=750
    -D STARTUP_DELAY_MS=1000

; Fuses (1MHz internal RC, default settings)
; board_fuses.lfuse = 0x64
; board_fuses.hfuse = 0xDF

[env:attiny2313_8mhz]
platform = atmelavr
board = attiny2313
framework = arduino

; 8MHz internal RC (requires fuse change)
board_build.f_cpu = 8000000L

upload_protocol = usbtiny

build_flags =
    -D IRPD_PULSE_MS=5
    -D LOOP_DELAY_MS=750
    -D STARTUP_DELAY_MS=1000

; Fuses for 8MHz internal RC
; board_fuses.lfuse = 0xE4
; board_fuses.hfuse = 0xDF
