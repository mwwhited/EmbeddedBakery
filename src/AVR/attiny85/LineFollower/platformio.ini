; PlatformIO Project Configuration File
;
; ATtiny85 Line Follower Controller
; Replaces LM393 dual comparator on D2-1 line follower robot
;
; Build:   pio run
; Upload:  pio run --target upload
; Fuses:   pio run --target fuses (sets 8MHz internal clock)

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; 8MHz internal oscillator (no external crystal needed)
board_build.f_cpu = 8000000L

; USBasp programmer (most common for ATtiny)
upload_protocol = usbasp
upload_flags =
    -B4              ; Slow SCK for 8MHz target

; Fuse settings for 8MHz internal RC oscillator
; Low:  0xE2 = 8MHz internal, no clock div/8
; High: 0xDF = SPIEN enabled, no RSTDISBL
; Ext:  0xFF = Self-programming disabled
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Alternative programmer configurations (uncomment as needed)
; [env:attiny85_arduinoisp]
; platform = atmelavr
; board = attiny85
; framework = arduino
; board_build.f_cpu = 8000000L
; upload_protocol = arduinoisp
; upload_port = /dev/ttyUSB0
; upload_speed = 19200
