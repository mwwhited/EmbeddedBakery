; PlatformIO Project Configuration File
; LXI Serial Bridge for ESP8266
;
; Provides LXI protocol support for serial-based test equipment
; - SCPI Raw Socket (TCP port 5025)
; - mDNS/DNS-SD discovery
; - Serial passthrough bridge

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Build flags
build_flags =
    -D SERIAL_BAUD=115200
    -D LXI_PORT=5025
    -D DEVICE_NAME=\"LxiBridge\"

; Library dependencies
lib_deps =
    ESP8266WiFi
    ESP8266mDNS
    ESP8266WebServer

; Upload settings
upload_speed = 921600

; Additional boards can be added as needed
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_flags =
    -D SERIAL_BAUD=115200
    -D LXI_PORT=5025
    -D DEVICE_NAME=\"LxiBridge\"
